<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" fill="none">
  <defs>
    <linearGradient id="stem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b3a2a"/>
      <stop offset="0.45" stop-color="#8b5137"/>
      <stop offset="1" stop-color="#4e2a22"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ff7a86"/>
      <stop offset="0.48" stop-color="#eb3352"/>
